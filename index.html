<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRForge — Generator Kode QR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f87171'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-styling@1.5.2/dist/qrcode-styling.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="app-head">
      <div class="brand">
        <div class="brand__mark">QR</div>
        <h1>QRForge</h1>
      </div>
    </header>

    <div class="qr-form">
      <div class="form-group">
        <label for="qrText">Teks atau URL</label>
        <input type="text" id="qrText" placeholder="https://nusa.studio" value="https://nusa.studio">
      </div>
      <div class="form-group">
        <label>Warna Foreground</label>
        <input type="color" id="fgColor" value="#1a1a1a">
      </div>
      <div class="form-group">
        <label>Wana Background</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
      <div class="form-group">
        <label>Ukuran (px)</label>
        <input type="number" id="size" value="300" min="100" max="500">
      </div>
      <button class="btn--secondary" id="downloadBtn">Download PNG</button>
    </div>

    <div id="qrContainer" style="text-align:center;margin:32px 0;">
      <canvas id="qrCanvas" width="300" height="300"></canvas>
    </div>
  </div>
</body>
</html>
